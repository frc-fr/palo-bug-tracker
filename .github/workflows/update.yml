name: Update data and site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -e '.[dev]'

      - name: Test
        run: |
          pytest -m "not corpus"
          node --test tests/site/logic.test.js

      # The pages are not versioned: the cache only spares fetching them again.
      - uses: actions/cache@v4
        with:
          path: .cache/html
          key: html-${{ github.run_id }}
          restore-keys: html-

      - name: Collect the Release Notes
        run: palobugs collect

      # Any warning stops here: the site keeps its last valid data.
      - name: Extract the issues
        run: palobugs extract

      - name: Check the real pages
        run: pytest -m corpus

      - name: Commit the data
        run: |
          git add sources data
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update PAN-OS data"
            git push
          fi

      - name: Build the site
        run: palobugs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
