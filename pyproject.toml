[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "palobugs"
version = "0.1.0"
description = "Structured PAN-OS bug data extracted from the official Release Notes"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
palobugs = "palobugs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: needs the downloaded pages in .cache/html"]
