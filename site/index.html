<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAN-OS Bug Tracker</title>
  <meta name="description" content="Recherche des bugs PAN-OS et de leurs corrections par version, hotfix et matériel.">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" type="application/atom+xml" title="PAN-OS Bug Tracker : quoi de neuf" href="feed.xml">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1><span class="brand">PAN-OS</span> Bug Tracker</h1>
        <p id="scope" data-text="page.scope"></p>
        <p class="privacy" data-text="page.privacy"></p>
      </div>
      <div class="top-actions">
        <a class="icon-link" href="feed.xml" data-label="news.subscribe">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M2.002 2.725a.75.75 0 0 1 .797-.699C8.79 2.42 13.58 7.21 13.974 13.201a.75.75 0 0 1-1.497.098 10.502 10.502 0 0 0-9.776-9.776.747.747 0 0 1-.7-.798ZM2.84 7.05h-.002a7.002 7.002 0 0 1 6.113 6.111.75.75 0 0 1-1.49.178 5.503 5.503 0 0 0-4.8-4.8.75.75 0 0 1 .179-1.489ZM2 13a1 1 0 1 1 2 0 1 1 0 0 1-2 0Z"/></svg>
        </a>
        <a class="icon-link" href="https://github.com/frc-fr/palo-bug-tracker" target="_blank" rel="noopener" data-label="page.repository">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button type="button" id="language" class="theme" data-text="language.switch" data-label="language.title"></button>
        <button type="button" id="theme" class="theme"></button>
      </div>
      <div class="top-meta muted">
        <p id="stats" data-text="page.loading"></p>
        <p id="updated"></p>
        <p id="schedule"></p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" data-label="tabs.label">
      <button type="button" id="tab-bugs" class="tab" aria-pressed="true" data-text="tab.bugs"></button>
      <button type="button" id="tab-upgrade" class="tab" aria-pressed="false" data-text="tab.upgrade"></button>
      <button type="button" id="tab-hardware" class="tab" aria-pressed="false" data-text="tab.hardware"></button>
      <button type="button" id="tab-news" class="tab" aria-pressed="false" data-text="tab.news"></button>
    </nav>
    <p id="view-help" class="view-help muted"></p>
    <p id="subscribe" class="view-help" hidden><a href="feed.xml" data-text="news.subscribe"></a></p>
    <section id="support" class="support" data-label="support.title" hidden></section>

    <section id="filters" class="filters" data-label="filter.label">
      <label class="field wide">
        <span data-text="filter.query"></span>
        <input id="query" type="search" autocomplete="off" spellcheck="false" data-placeholder="filter.queryExample">
      </label>
      <div class="field" id="field-from" hidden>
        <label for="from-input" data-text="filter.from"></label>
        <div class="combo" id="from"></div>
      </div>
      <div class="field">
        <label for="version-input" id="version-label"></label>
        <div class="combo" id="version"></div>
      </div>
      <div class="field">
        <label for="model-input" data-text="filter.model"></label>
        <div class="combo" id="model"></div>
      </div>
      <button type="button" id="reset" class="reset" data-text="filter.reset"></button>
    </section>

    <div id="news-summary" class="news-summary"></div>
    <section id="hardware-tools" class="filters" data-label="hardware.label" hidden>
      <label class="field wide">
        <span data-text="hardware.search"></span>
        <input id="hardware-query" type="search" autocomplete="off" spellcheck="false" data-placeholder="hardware.placeholder">
      </label>
      <p class="muted hardware-note" data-html="hardware.note"></p>
      <p id="recommended-note" class="muted hardware-note"></p>
    </section>
    <p id="version-info" class="version-info muted"></p>
    <p id="recommendation" class="version-info"></p>
    <div id="notices"></div>
    <div id="upgrade-notices"></div>
    <div id="chips" class="summary" role="group" data-label="filter.status"></div>
    <div class="list-bar">
      <p id="count" class="count" aria-live="polite"></p>
      <div class="list-actions">
        <button type="button" id="copy" class="action" data-text="list.copy" hidden></button>
      </div>
    </div>
    <div id="results" class="results"></div>
    <button type="button" id="more" class="more" hidden></button>
    <details id="legend" class="legend">
      <summary data-text="legend.title"></summary>
      <dl>
        <dt><span class="badge affected" data-text="status.affected"></span></dt>
        <dd data-text="legend.affected"></dd>
        <dt><span class="badge fixed" data-text="status.fixed"></span></dt>
        <dd data-text="legend.fixed"></dd>
        <dt><span class="badge potential" data-text="status.potential"></span></dt>
        <dd data-text="legend.potential"></dd>
        <dt><span class="badge unknown" data-text="status.unknown"></span></dt>
        <dd data-text="legend.unknown"></dd>
      </dl>
      <p class="muted" data-text="legend.releases"></p>
      <p class="muted" data-text="legend.note"></p>
    </details>
    <button type="button" id="to-top" class="to-top" data-text="page.top" hidden></button>
  </main>

  <footer class="wrap muted">
    <p data-text="footer.source"></p>
    <p data-html="footer.credit"></p>
  </footer>
  <script src="i18n.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
